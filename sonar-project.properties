# Project identity
sonar.projectKey=hanaro
sonar.projectName=Hanaro
sonar.sourceEncoding=UTF-8

# Application source and test scope
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.exclusions=frontend/src/**/*.spec.ts,backend/src/**/__pycache__/**,backend/src/**/*.pyc
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.spec.ts

# Generated and vendored content
sonar.coverage.exclusions=frontend/src/main.ts,frontend/src/main.server.ts,frontend/src/server.ts,frontend/src/app/app.config*.ts,frontend/src/app/app.routes*.ts
sonar.cpd.exclusions=backend/tests/**,frontend/src/**/*.spec.ts

# Language configuration
sonar.python.version=3.11
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json

# Reports are generated before the scanner runs. SonarQube imports them; it
# does not calculate coverage itself.
sonar.python.coverage.reportPaths=reports/sonar/backend-coverage.xml
sonar.javascript.lcov.reportPaths=reports/sonar/frontend-lcov.info

# Make the scanner fail only after the server has evaluated the quality gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
