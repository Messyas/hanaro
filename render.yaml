services:
  - type: web
    name: hanaro-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CREATE_TABLES_ON_STARTUP
        value: "false"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: CONFIRM_PRODUCTION_MIGRATION
        value: "yes"
      - key: BOOTSTRAP_INITIAL_DATA
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_DATA_PATH
        value: seed/synthetic
      - key: DEMO_DATA_REFERENCE_DATE
        value: "2026-09-03"
      - key: DEMO_DATA_EXCHANGE_RATE
        value: "5.15"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENABLE_DOCS_IN_PRODUCTION
        value: "false"
      - key: PRODUCTION_SECURITY_VALIDATION_ENABLED
        value: "true"
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: CORS_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_SECURE_COOKIES
        value: "true"
      - key: SESSION_BACKEND
        value: memory
      - key: CACHE_ENABLED
        value: "false"
      - key: RATE_LIMITER_ENABLED
        value: "false"
      - key: TASKIQ_ENABLED
        value: "false"
      - key: POSTGRES_POOL_SIZE
        value: "5"
      - key: POSTGRES_MAX_OVERFLOW
        value: "2"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: TRUSTED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
