name: Quality Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: pip install uv

      - name: Sync Python workspace
        run: uv sync --all-packages --all-extras

      - name: Backend tests
        working-directory: backend
        run: uv run --no-sync pytest --cov=src --cov-report=term-missing
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only
          DEBUG: "false"

      - name: Backend lint and type check
        working-directory: backend
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
          uv run --no-sync mypy src

      - name: Audit backend production dependencies
        run: |
          uv export --quiet --frozen --package fastapi-boilerplate --no-dev --no-editable --no-emit-project --output-file /tmp/backend-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/backend-requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests, formatting and build
        working-directory: frontend
        run: |
          npm run test:coverage
          npm run format:check
          npm run build
          npm run build:cloudflare

      - name: Validate Cloudflare Worker bundle
        working-directory: frontend
        run: npx --yes wrangler@4 deploy --dry-run
